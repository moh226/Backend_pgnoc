# Environnement de développement/production locale : API + PostgreSQL + MinIO.
#
#   docker compose up --build
#   # migrations appliquées automatiquement au démarrage (point d'entrée)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pgnoc_ti}
      POSTGRES_USER: ${POSTGRES_USER:-pgnoc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgnoc_ti_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgnoc_user} -d ${POSTGRES_DB:-pgnoc_ti}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-pgnoc_ti}
      POSTGRES_USER: ${POSTGRES_USER:-pgnoc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgnoc_ti_secret}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-pgnoc-ti-documents}
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_USE_SSL: "False"
      DJANGO_LOG_TO_FILE: "False"
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL:-}
      GOOGLE_OAUTH_FRONT_REDIRECT: ${GOOGLE_OAUTH_FRONT_REDIRECT:-}
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn pgnoc.wsgi:application --bind 0.0.0.0:8000
             --workers 4 --timeout 60"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz/')\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  minio_data:
