name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pgnoc_ti
          POSTGRES_USER: pgnoc_user
          POSTGRES_PASSWORD: pgnoc_ti_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgnoc_user -d pgnoc_ti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "False"
      POSTGRES_DB: pgnoc_ti
      POSTGRES_USER: pgnoc_user
      POSTGRES_PASSWORD: pgnoc_ti_secret
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: testserver,localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifications Django (system check)
        run: python manage.py check

      - name: Suite de tests complète
        run: python manage.py test --noinput

      - name: Schéma OpenAPI générable
        run: python manage.py spectacular --file schema.yml
