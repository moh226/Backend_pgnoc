<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titre %}PGNOC-TI{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { background: #1a237e; color: #ffffff; padding: 24px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; }
        .body { padding: 32px 24px; color: #333333; line-height: 1.6; }
        .body p { margin: 0 0 16px; }
        .btn { display: inline-block; background: #1a237e; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 4px; font-weight: bold; }
        .footer { background: #f9f9f9; padding: 16px 24px; text-align: center; font-size: 12px; color: #999999; border-top: 1px solid #eeeeee; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PGNOC-TI</h1>
        </div>
        <div class="body">
            {% block contenu %}{% endblock %}
        </div>
        <div class="footer">
            Plateforme d'ouverture de comptes-titres — UEMOA<br>
            © {{ annee }} PGNOC-TI. Tous droits réservés.
        </div>
    </div>
</body>
</html>
